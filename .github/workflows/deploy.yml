name: CI/CD Pipeline (Web App)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Log in to Docker Hub
      - name: Docker Hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # 4️⃣ Build and push Docker image for Pi 5 (ARM64)
      - name: Build and push Docker image for Pi 5
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/arm64 \
            -t eliasbe123/elias-portfolio:latest \
            --push .

      # 5️⃣ Deploy to Pi via VPS
      - name: Deploy on Pi via VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail

          echo "Starting SSH agent..."
          eval "$(ssh-agent -s)"

          # Add keys
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' | ssh-add -
          echo "${{ secrets.PI_SSH_KEY }}" | tr -d '\r' | ssh-add -

          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts

          echo "Testing connection to VPS..."
          ssh -o StrictHostKeyChecking=no deploy@$VPS_HOST "echo Connected to VPS"

          echo "Testing connection to Pi via VPS..."
          ssh -A -o StrictHostKeyChecking=no -J deploy@$VPS_HOST $PI_USER@$PI_HOST "echo Connected to Pi"

          echo "Copying docker-compose.yml to Pi..."
          scp -o StrictHostKeyChecking=no -J deploy@$VPS_HOST ./infra/pi/docker-compose.yml $PI_USER@$PI_HOST:~/deploy/docker-compose.yml

          echo "Cleaning up old Docker images on Pi..."
          ssh -A -o StrictHostKeyChecking=no -J deploy@$VPS_HOST $PI_USER@$PI_HOST "
            set -e
            # Remove stopped containers
            docker container prune -f || true

            # Remove dangling images (unused images not referenced by any container)
            docker image prune -f || true

            # Remove images older than 7 days
            docker images --format '{{.Repository}}:{{.Tag}} {{.CreatedSince}}' | grep 'weeks\|months\|years' | awk '{print \$1}' | xargs -r docker rmi -f || true
          "

          echo "Deploying Docker image on Pi..."
          ssh -A -o StrictHostKeyChecking=no -J deploy@$VPS_HOST $PI_USER@$PI_HOST "
            set -e
            cd ~/deploy || mkdir -p ~/deploy && cd ~/deploy
            docker pull eliasbe123/elias-portfolio:latest
            docker compose down || true
            docker compose up -d --build
          "
  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH keys and known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Add VPS and Pi to known_hosts
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.PI_HOST }} >> ~/.ssh/known_hosts

      - name: SSH tunnel + OWASP ZAP scan
        env:
          PI_USER: ${{ secrets.PI_USER }}
          PI_HOST: ${{ secrets.PI_HOST }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          STAGING_URL: ${{ env.STAGING_URL }}
        run: |
          set -euo pipefail

          echo "Starting SSH agent..."
          eval "$(ssh-agent -s)"

          # Add SSH keys
          echo "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' | ssh-add -
          echo "${{ secrets.PI_SSH_KEY }}" | tr -d '\r' | ssh-add -

          # Start SSH tunnel in background
          ssh -f -N -L 3000:localhost:3000 \
            -o StrictHostKeyChecking=no \
            -J deploy@$VPS_HOST \
            $PI_USER@$PI_HOST
          echo "SSH tunnel established to Pi"

          # Run OWASP ZAP baseline scan in the same shell/session
          echo "Running OWASP ZAP scan..."
          npx zaproxy-action-baseline \
            --target $STAGING_URL \
            --rules-file ./zap-rules.json \
            --cmd-options "-r zap-report.html -z \"includeInContext('API Context','^$STAGING_URL/api/.*');\" -z \"spider.baseUrl=$STAGING_URL\""

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html


